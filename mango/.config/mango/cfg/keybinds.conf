# Super-based keybinds — leaves Ctrl/Alt/middle-click free for apps.
# Key names: check with `wev`. Modifiers: super, ctrl, alt, shift, none.

# --- System ---
bind=SUPER,r,reload_config
bind=SUPER,m,quit
# Emergency: disable shortcut inhibitors (Niri had toggle-keyboard-shortcuts-inhibit).
# Mango has no inhibitor-bypass flag; Super+R reload restores allow_shortcuts_inhibit.
bind=SUPER,Escape,setoption,allow_shortcuts_inhibit,0

# --- Apps & Noctalia ---
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,l,spawn,noctalia msg session lock

# Screenshots (Noctalia; mirrors old Niri Ctrl+Shift+1/2/3)
bind=CTRL+SHIFT,1,spawn,noctalia msg screenshot-region
bind=CTRL+SHIFT,2,spawn,noctalia msg screenshot-fullscreen
bind=CTRL+SHIFT,3,spawn,noctalia msg screenshot-fullscreen pick

# Media keys (hardware; safe to keep unmodified)
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# --- Window lifecycle ---
bind=SUPER,q,killclient,

# --- Focus ---
bind = super,Left,focusdir,left
bind = super,Down,focusdir,down
bind = super,Up,focusdir,up
bind = super,Right,focusdir,right
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,previous

# --- Tags ---
bind = super+ctrl,Left,viewtoleft_have_client,0
bind = super+ctrl,Right,viewtoright_have_client,0
bind = super+ctrl+alt,Left,tagtoleft,0
bind = super+ctrl+alt,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# --- Toggle another combined tag into view (manual "combined" view, ad-hoc) ---
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

# --- Window state ---
bind=SUPER,backslash,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,o,toggleoverlay,
bind=SUPER,grave,toggleoverview,

# --- Layout ---
bind=SUPER,n,switch_layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=SUPER+ALT+SHIFT,Left,scroller_stack,left
bind=SUPER+ALT+SHIFT,down,scroller_stack,down
bind=SUPER+ALT+SHIFT,Up,scroller_stack,up
bind=SUPER+ALT+SHIFT,right,scroller_stack,right
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction

# --- Swap windows ---
bind = super+alt,Left,exchange_client,left
bind = super+alt,Down,exchange_client,down
bind = super+alt,Up,exchange_client,up
bind = super+alt,Right,exchange_client,right

# --- Monitors ---
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,j,tagmon,down
bind=SUPER+CTRL+SHIFT,k,tagmon,up
bind=SUPER+CTRL+SHIFT,l,tagmon,right

# --- Gaps ---
bind=SUPER+SHIFT,r,togglegaps

# --- Floating window move/resize ---
bind=SUPER+ALT,h,resizewin,-50,+0
bind=SUPER+ALT,j,resizewin,+0,+50
bind=SUPER+ALT,k,resizewin,+0,-50
bind=SUPER+ALT,l,resizewin,+50,+0

# --- Mouse (middle click left free for browsers) ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Scroll wheel ---
axisbind = super,up,focusdir,left
axisbind = super,down,focusdir,right
