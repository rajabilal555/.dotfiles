# Environment variables for child processes.
# Ported from Niri cfg/misc.kdl. Reset on config reload; relogin if something misbehaves.
#
# XDG_CURRENT_DESKTOP=gnome keeps Electron/Qt portal hints working under Mango.
# but we try correct until we face issues

env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XCURSOR_THEME,capitaine-cursors
env=XCURSOR_SIZE,24
