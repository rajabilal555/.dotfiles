# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

windowrule=appid:brave-browser,tags:1,scroller_proportion:1
windowrule=title:^Picture[- ]in[- ][Pp]icture$,isfloating:1,isglobal:1,isoverlay:1,width:0.25,height:0.25,offsetx:85,offsety:-85,isnoborder:0,noblur:1

windowrule=tags:2,appid:dev.zed.Zed
windowrule=tags:2,appid:code
; Negative lookahead to exclude Cursor Agents
windowrule=tags:2,appid:cursor,title:^(?!Cursor Agents).*$
windowrule=tags:2,appid:scrcpy

windowrule=appid:slack,tags:3,scroller_proportion_single:1,scroller_proportion:0.5
windowrule=appid:discord,tags:3,scroller_proportion_single:1,scroller_proportion:0.5

# Tag 8 — Steam client (monocle). Float popups; main library tiled.
windowrule=appid:^steam$,tags:8,isfloating:1
windowrule=appid:^steam$,title:^Steam$,tags:8,isfloating:0
windowrule=appid:^steam$,title:^Friends List$,tags:8,isfloating:1
windowrule=appid:^steam$,title:^Steam Settings$,tags:8,isfloating:1

# Tag 9 — Games (monocle). Steam-launched games report steam_app_*.
windowrule=appid:^steam_app_,tags:9
windowrule=appid:^gamescope$,tags:9

# Software specfic stuff
# Terminal
windowrule=isnamedscratchpad:1,width:1400,height:900,appid:foot
bind=SUPER,Return,toggle_named_scratchpad,foot,none,foot
# Cursor
windowrule=isnamedscratchpad:1,width:1400,height:900,appid:cursor,title:^Cursor Agents$
bind=SUPER+Shift,c,toggle_named_scratchpad,none,Cursor Agents,cursor


layerrule = noanim:1, noblur:1, layer_name:selection
