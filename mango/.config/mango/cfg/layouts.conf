# Scroller layout
scroller_structs=4
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.25,0.5,0.8,1.0

# Master-stack layout
new_is_master = 0
default_mfact = 0.70
default_nmaster = 1
smartgaps = 0

# Dwindle layout
dwindle_smart_split=1
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Layout support:
# tile, scroller, monocle, grid, deck, center_tile vertical_tile
# right_tile vertical_scroller vertical_grid vertical_deck dwindle
# fair vertical_fair
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile,mfact:0.75
tagrule=id:3,layout_name:tile,mfact:0.5
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:monocle
tagrule=id:9,layout_name:monocle
