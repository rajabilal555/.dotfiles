# -*- conf -*-
# https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

[main]
include=~/.config/foot/themes/noctalia.ini

# Primary: Meslo Nerd Font (icons/powerline built in)
# Fallbacks: Symbols Nerd Font Mono, Font Awesome, emoji, symbols, latin mono
font=MesloLGS Nerd Font Mono:size=12, FontAwesome:size=12
font-size-adjustment=0.5

pad=8x8 center-when-maximized-and-fullscreen
dpi-aware=no
bold-text-in-bright=no
initial-window-size-chars=100x30
box-drawings-uses-font-glyphs=no
selection-target=clipboard

[colors-dark]
alpha=0.85

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=underline
blink=no
underline-thickness=1.5

[mouse]
hide-when-typing=yes

[bell]
urgent=yes
notify=yes
visual=no

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o
fullscreen=F11
